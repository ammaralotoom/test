<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>License Map</title>


  <!-- ArcGIS Maps SDK -->
  <script
    type="module"
    src="https://js.arcgis.com/5.1/"
  ></script>


  <style>

    html,
    body {
      padding: 0;
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }


    #container {
      display: flex;
      height: 100vh;
    }


    /* =========================================================
       SIDEBAR
    ========================================================= */

    #sidebar {
      width: 340px;
      background: white;
      border-right: 1px solid #ccc;
      overflow-y: auto;
      z-index: 10;
    }


    #sidebarHeader {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      background: white;
      z-index: 20;
    }


    #sidebarHeader h2 {
      margin: 0 0 12px 0;
    }


    #filterInfo {
      margin-top: 8px;
      font-size: 14px;
      color: #333;
    }


    #count {
      margin-top: 6px;
      color: #666;
      font-size: 14px;
    }


    #licenseList {
      list-style: none;
      padding: 0;
      margin: 0;
    }


    .license-item {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.15s;
    }


    .license-item:hover {
      background: #f3f3f3;
    }


    .license-item.selected {
      background: #e6f3ff;
      border-left: 4px solid #007ac2;
      padding-left: 11px;
    }


    .license-id {
      font-weight: bold;
      font-size: 15px;
      color: #222;
    }


    .contractor {
      margin-top: 4px;
      font-size: 13px;
    }


    .request-type {
      margin-top: 4px;
      font-size: 12px;
      font-weight: bold;
    }


    .status {
      margin-top: 4px;
      font-size: 12px;
      color: #555;
    }


    .coordinates {
      margin-top: 4px;
      color: #777;
      font-size: 11px;
    }


    /* =========================================================
       MAP
    ========================================================= */

    #viewDiv {
      flex: 1;
      height: 100%;
    }


    .esri-basemap-gallery {
      width: 300px;
      max-height: 450px;
    }

  </style>

</head>


<body>


<div id="container">


  <!-- =======================================================
       SIDEBAR
  ======================================================== -->

  <div id="sidebar">


    <div id="sidebarHeader">

      <h2>
        Licenses
      </h2>


      <div id="filterInfo">
      </div>


      <div id="count">
        Loading data...
      </div>

    </div>


    <ul id="licenseList">
    </ul>


  </div>


  <!-- =======================================================
       MAP
  ======================================================== -->

  <div id="viewDiv">
  </div>


</div>



<script type="module">


  // ============================================================
  // DATA URL
  // ============================================================

  const DATA_URL =
    "./data.json";


  // ============================================================
  // REQUEST TYPE
  //
  // IMPORTANT:
  //
  // ?requestType=all
  //
  // means:
  //
  // DO NOT FILTER Request_Type AT ALL
  //
  // ============================================================

  const urlParams =
    new URLSearchParams(
      window.location.search
    );


  const rawRequestType =
    urlParams.get(
      "requestType"
    ) || "";


  // ------------------------------------------------------------
  // IMPORTANT FIX
  //
  // Convert "all" into an empty filter.
  //
  // Therefore:
  //
  // requestType=all
  //
  // behaves EXACTLY like:
  //
  // no requestType parameter
  // ------------------------------------------------------------

  let requestTypeFilter =
    String(
      rawRequestType
    ).trim();


  if (
    requestTypeFilter.toLowerCase() === "all"
  ) {

    requestTypeFilter = "";

  }


  const normalizedFilter =
    requestTypeFilter
      .toLowerCase();


  // ============================================================
  // ARCGIS IMPORTS
  // ============================================================

  const [

    Map,

    MapView,

    Graphic,

    GraphicsLayer,

    BasemapGallery,

    Expand

  ] =
    await $arcgis.import([

      "@arcgis/core/Map.js",

      "@arcgis/core/views/MapView.js",

      "@arcgis/core/Graphic.js",

      "@arcgis/core/layers/GraphicsLayer.js",

      "@arcgis/core/widgets/BasemapGallery.js",

      "@arcgis/core/widgets/Expand.js"

    ]);


  // ============================================================
  // GRAPHICS LAYER
  // ============================================================

  const graphicsLayer =
    new GraphicsLayer();


  // ============================================================
  // MAP
  // ============================================================

  const map =
    new Map({

      basemap:
        "streets-vector",

      layers:
        [
          graphicsLayer
        ]

    });


  // ============================================================
  // VIEW
  // ============================================================

  const view =
    new MapView({

      container:
        "viewDiv",

      map:
        map,

      center:
        [
          46.6753,
          24.7136
        ],

      zoom:
        10,

      popupEnabled:
        true

    });


  // ============================================================
  // BASEMAP GALLERY
  // ============================================================

  const basemapGallery =
    new BasemapGallery({

      view:
        view

    });


  const basemapExpand =
    new Expand({

      view:
        view,

      content:
        basemapGallery,

      expandIcon:
        "basemap",

      expandTooltip:
        "Change Basemap"

    });


  view.ui.add(
    basemapExpand,
    "top-right"
  );


  // ============================================================
  // HTML ELEMENTS
  // ============================================================

  const licenseList =
    document.getElementById(
      "licenseList"
    );


  const countDiv =
    document.getElementById(
      "count"
    );


  const filterInfo =
    document.getElementById(
      "filterInfo"
    );


  // ============================================================
  // DISPLAY FILTER
  // ============================================================

  if (
    requestTypeFilter
  ) {

    filterInfo.textContent =
      "Request Type: " +
      requestTypeFilter;

  }

  else {

    filterInfo.textContent =
      "Request Type: All";

  }


  // ============================================================
  // FORMAT DATE
  // ============================================================

  function formatDate(value) {


    if (!value) {

      return "";

    }


    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return value;

    }


    return date.toLocaleDateString(
      "en-GB"
    );

  }


  // ============================================================
  // FORMAT MONEY
  // ============================================================

  function formatMoney(value) {


    const number =
      Number(value);


    if (
      !Number.isFinite(
        number
      )
    ) {

      return escapeHtml(
        value
      );

    }


    return number.toLocaleString(
      "en-US"
    ) + " SAR";

  }


  // ============================================================
  // POPUP ROW
  // ============================================================

  function popupRow(
    label,
    value,
    shouldEscape = true
  ) {


    const safeLabel =
      escapeHtml(
        label
      );


    const safeValue =
      shouldEscape

        ? escapeHtml(
            value ?? ""
          )

        : value;


    return `

      <div style="
        display:grid;
        grid-template-columns:125px 1fr;
        gap:8px;
        margin-bottom:4px;
      ">

        <div style="
          font-weight:bold;
          color:#444;
        ">

          ${safeLabel}:

        </div>


        <div>

          ${safeValue}

        </div>

      </div>

    `;

  }


  // ============================================================
  // CREATE POPUP CONTENT
  // ============================================================

  function createPopupContent(row) {


    return `

      <div style="
        width:320px;
        max-width:100%;
        font-family:Arial,sans-serif;
        font-size:13px;
        line-height:1.5;
      ">


        <!-- TRANSACTION -->

        <div style="
          font-weight:bold;
          font-size:15px;
          margin-bottom:6px;
          padding-bottom:4px;
          border-bottom:1px solid #ddd;
        ">

          Transaction

        </div>


        ${popupRow(
          "Transaction ID",
          row.Transaction_ID
        )}


        ${popupRow(
          "Transaction Date",
          formatDate(
            row.Transaction_Date
          )
        )}



        <!-- CONTRACTOR -->

        <div style="
          font-weight:bold;
          font-size:15px;
          margin-top:15px;
          margin-bottom:6px;
          padding-bottom:4px;
          border-bottom:1px solid #ddd;
        ">

          Contractor

        </div>


        ${popupRow(
          "Contractor ID",
          row.Contractor_ID
        )}


        ${popupRow(
          "Contractor Name",
          row.Contractor_Name
        )}



        <!-- LICENSE -->

        <div style="
          font-weight:bold;
          font-size:15px;
          margin-top:15px;
          margin-bottom:6px;
          padding-bottom:4px;
          border-bottom:1px solid #ddd;
        ">

          License

        </div>


        ${popupRow(
          "License ID",
          row.License_ID
        )}


        ${popupRow(
          "Category",
          row.Category
        )}


        ${popupRow(
          "License Type",
          row.License_Type
        )}


        ${popupRow(
          "License Status",
          row.License_Status
        )}


        ${popupRow(
          "Request Type",
          row.Request_Type
        )}



        <!-- CARD -->

        <div style="
          font-weight:bold;
          font-size:15px;
          margin-top:15px;
          margin-bottom:6px;
          padding-bottom:4px;
          border-bottom:1px solid #ddd;
        ">

          Card

        </div>


        ${popupRow(
          "Card Type",
          row.Card_Type
        )}


        ${popupRow(
          "Card ID",
          row.Card_ID
        )}



        <!-- FINANCIAL -->

        <div style="
          font-weight:bold;
          font-size:15px;
          margin-top:15px;
          margin-bottom:6px;
          padding-bottom:4px;
          border-bottom:1px solid #ddd;
        ">

          Financial

        </div>


        ${popupRow(
          "Value",
          formatMoney(
            row.Value_SAR
          ),
          false
        )}



        <!-- LOCATION -->

        <div style="
          font-weight:bold;
          font-size:15px;
          margin-top:15px;
          margin-bottom:6px;
          padding-bottom:4px;
          border-bottom:1px solid #ddd;
        ">

          Location

        </div>


        ${popupRow(
          "Latitude",
          Number(
            row.Latitude
          ).toFixed(6)
        )}


        ${popupRow(
          "Longitude",
          Number(
            row.Longitude
          ).toFixed(6)
        )}


      </div>

    `;

  }


  // ============================================================
  // OPEN POPUP
  // ============================================================

  async function openRecordPopup(
    graphic,
    row
  ) {


    try {


      try {

        view.closePopup();

      }

      catch (error) {

        console.log(
          "No popup to close"
        );

      }


      await view.goTo(
        {

          target:
            graphic.geometry,

          zoom:
            17

        },
        {

          duration:
            800

        }
      );


      await view.openPopup({

        location:
          graphic.geometry,

        title:
          "License: " +
          row.License_ID,

        content:
          createPopupContent(
            row
          )

      });


    }

    catch(error) {


      console.error(
        "Error opening popup:",
        error
      );

    }

  }


  // ============================================================
  // LOAD JSON DATA
  // ============================================================

  async function loadData() {


    try {


      countDiv.textContent =
        "Loading data...";


      licenseList.innerHTML =
        "";


      graphicsLayer.removeAll();


      // ========================================================
      // FETCH JSON
      // ========================================================

      const response =
        await fetch(
          DATA_URL
        );


      if (
        !response.ok
      ) {

        throw new Error(
          `HTTP ${response.status}`
        );

      }


      const data =
        await response.json();


      // ========================================================
      // GET TRANSACTIONS
      // ========================================================

      const rows =

        Array.isArray(
          data.TransactionsTable
        )

          ? data.TransactionsTable

          : [];


      console.log(
        "Loaded records:",
        rows.length
      );


      console.log(
        "Raw requestType:",
        rawRequestType
      );


      console.log(
        "Effective requestType filter:",
        requestTypeFilter || "ALL"
      );


      // ========================================================
      // FILTER
      // ========================================================
      //
      // IMPORTANT:
      //
      // If requestTypeFilter === ""
      //
      // then NO Request_Type filtering occurs.
      //
      // requestType=all was converted to "" above.
      //
      // ========================================================

      const validRows =

        rows.filter(

          row => {


            const latitude =
              Number(
                row.Latitude
              );


            const longitude =
              Number(
                row.Longitude
              );


            const hasCoordinates =

              Number.isFinite(
                latitude
              )

              &&

              Number.isFinite(
                longitude
              );


            const hasLicense =

              String(
                row.License_ID || ""
              )

                .trim()

              !== "";


            // -----------------------------------------------
            // REQUEST TYPE
            // -----------------------------------------------

            let matchesRequestType =
              true;


            // ONLY filter when an actual request type
            // was supplied.
            //
            // If requestType=all:
            //
            // requestTypeFilter = ""
            //
            // therefore this block NEVER runs.

            if (
              normalizedFilter !== ""
            ) {


              const rowRequestType =

                String(
                  row.Request_Type || ""
                )

                  .trim()

                  .toLowerCase();


              matchesRequestType =

                rowRequestType ===
                normalizedFilter;

            }


            return (

              hasCoordinates

              &&

              hasLicense

              &&

              matchesRequestType

            );

          }

        );


      console.log(
        "Displayed records:",
        validRows.length
      );


      // ========================================================
      // COUNT
      // ========================================================

      countDiv.textContent =
        `${validRows.length} licenses found`;


      // ========================================================
      // CREATE RECORDS
      // ========================================================

      validRows.forEach(

        (row, index) => {


          const latitude =
            Number(
              row.Latitude
            );


          const longitude =
            Number(
              row.Longitude
            );


          // ====================================================
          // GEOMETRY
          // ====================================================

          const point = {

            type:
              "point",

            longitude:
              longitude,

            latitude:
              latitude

          };


          // ====================================================
          // MARKER
          // ====================================================

          const symbol = {

            type:
              "simple-marker",

            style:
              "circle",

            size:
              12,

            color:
              "#007ac2",

            outline: {

              color:
                "#ffffff",

              width:
                1.5

            }

          };


          // ====================================================
          // GRAPHIC
          // ====================================================

          const graphic =
            new Graphic({


              geometry:
                point,


              symbol:
                symbol,


              attributes: {


                ObjectID:
                  index + 1,


                Transaction_ID:
                  row.Transaction_ID || "",


                Transaction_Date:
                  row.Transaction_Date || "",


                Contractor_ID:
                  row.Contractor_ID || "",


                Contractor_Name:
                  row.Contractor_Name || "",


                License_ID:
                  row.License_ID || "",


                Category:
                  row.Category || "",


                License_Type:
                  row.License_Type || "",


                License_Status:
                  row.License_Status || "",


                Request_Type:
                  row.Request_Type || "",


                Card_Type:
                  row.Card_Type || "",


                Card_ID:
                  row.Card_ID || "",


                Value_SAR:
                  row.Value_SAR ?? "",


                Latitude:
                  latitude,


                Longitude:
                  longitude

              },


              popupTemplate: {


                title:
                  "License: " +
                  escapeHtml(
                    row.License_ID
                  ),


                content:
                  createPopupContent(
                    row
                  )

              }

            });


          graphicsLayer.add(
            graphic
          );


          // ====================================================
          // SIDEBAR ITEM
          // ====================================================

          const li =
            document.createElement(
              "li"
            );


          li.className =
            "license-item";


          li.innerHTML = `


            <div class="license-id">

              ${escapeHtml(
                row.License_ID
              )}

            </div>


            <div class="contractor">

              ${escapeHtml(
                row.Contractor_Name || ""
              )}

            </div>


            <div class="request-type">

              Request Type:

              ${escapeHtml(
                row.Request_Type || ""
              )}

            </div>


            <div class="status">

              Status:

              ${escapeHtml(
                row.License_Status || ""
              )}

            </div>


            <div class="coordinates">

              ${latitude.toFixed(6)},

              ${longitude.toFixed(6)}

            </div>


          `;


          // ====================================================
          // CLICK SIDEBAR ITEM
          // ====================================================

          li.addEventListener(

            "click",

            async function() {


              document
                .querySelectorAll(
                  ".license-item.selected"
                )
                .forEach(

                  item => {

                    item.classList.remove(
                      "selected"
                    );

                  }

                );


              li.classList.add(
                "selected"
              );


              await openRecordPopup(
                graphic,
                row
              );


            }

          );


          licenseList.appendChild(
            li
          );


        }

      );


      // ========================================================
      // INITIAL MAP EXTENT
      // ========================================================

      if (
        graphicsLayer.graphics.length > 0
      ) {


        await view.goTo(

          graphicsLayer.graphics.toArray(),

          {

            padding: {

              top:
                60,

              right:
                60,

              bottom:
                60,

              left:
                60

            }

          }

        );

      }


      else {


        // IMPORTANT:
        //
        // requestType=all becomes requestTypeFilter=""
        //
        // so you will NEVER get:
        //
        // No licenses found for "all"

        if (
          requestTypeFilter
        ) {

          countDiv.textContent =

            `No licenses found for "${requestTypeFilter}"`;

        }

        else {

          countDiv.textContent =
            "No licenses found";

        }

      }


    }

    catch(error) {


      console.error(
        "LOAD ERROR:",
        error
      );


      countDiv.textContent =
        "Error loading data";


      alert(
        "Error loading data. Check browser console."
      );

    }

  }


  // ============================================================
  // ESCAPE HTML
  // ============================================================

  function escapeHtml(value) {


    return String(
      value ?? ""
    )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  // ============================================================
  // START
  // ============================================================

  await view.when();


  await loadData();


</script>


</body>

</html>
