<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>License Map</title>

  <!-- ArcGIS Maps SDK for JavaScript -->
  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #container {
      display: flex;
      height: 100vh;
    }

    #sidebar {
      width: 340px;
      background: white;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }

    #sidebarHeader {
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }

    #sidebarHeader h2 {
      margin: 0 0 12px 0;
    }

    #filterInfo {
      margin-top: 12px;
      font-size: 14px;
      color: #333;
    }

    #count {
      margin-top: 6px;
      color: #666;
      font-size: 14px;
    }

    #licenseList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .license-item {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .license-item:hover {
      background: #f3f3f3;
    }

    .license-id {
      font-weight: bold;
      font-size: 15px;
    }

    .contractor {
      margin-top: 4px;
      font-size: 13px;
    }

    .request-type {
      margin-top: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .status {
      margin-top: 4px;
      font-size: 12px;
      color: #555;
    }

    .coordinates {
      margin-top: 4px;
      color: #777;
      font-size: 12px;
    }

    #viewDiv {
      flex: 1;
      height: 100%;
    }

    /* Popup content styling */
    .popup-content {
      min-width: 300px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.6;
    }

    .popup-section {
      margin-bottom: 12px;
    }

    .popup-section-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
      padding-bottom: 3px;
      border-bottom: 1px solid #ddd;
    }

    .popup-row {
      margin-bottom: 3px;
    }

    .popup-label {
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="container">

  <div id="sidebar">

    <div id="sidebarHeader">

      <h2>Licenses</h2>

      <div id="filterInfo"></div>

      <div id="count">
        Loading data...
      </div>

    </div>

    <ul id="licenseList"></ul>

  </div>

  <div id="viewDiv"></div>

</div>


<script type="module">

  // ============================================================
  // JSON DATA
  // ============================================================

  const DATA_URL = "./data.json";


  // ============================================================
  // REQUEST TYPE FILTER FROM URL
  //
  // Examples:
  //
  // ?requestType=Cancellation%20Request
  // ?requestType=Renewal%20Request
  // ?requestType=New%20License%20Request
  //
  // ============================================================

  const urlParams =
    new URLSearchParams(window.location.search);

  const requestTypeFilter =
    urlParams.get("requestType") || "";


  // ============================================================
  // IMPORT ARCGIS CLASSES
  // ============================================================

  const [
    Map,
    MapView,
    Graphic,
    GraphicsLayer
  ] = await $arcgis.import([
    "@arcgis/core/Map.js",
    "@arcgis/core/views/MapView.js",
    "@arcgis/core/Graphic.js",
    "@arcgis/core/layers/GraphicsLayer.js"
  ]);


  // ============================================================
  // GRAPHICS LAYER
  // ============================================================

  const graphicsLayer =
    new GraphicsLayer();


  // ============================================================
  // MAP
  // ============================================================

  const map =
    new Map({
      basemap: "streets-vector",
      layers: [graphicsLayer]
    });


  // ============================================================
  // MAP VIEW
  // ============================================================

  const view =
    new MapView({

      container: "viewDiv",

      map: map,

      center: [
        46.6753,
        24.7136
      ],

      zoom: 10,

      popup: {
        dockEnabled: false
      }

    });


  // ============================================================
  // HTML ELEMENTS
  // ============================================================

  const licenseList =
    document.getElementById("licenseList");

  const countDiv =
    document.getElementById("count");

  const filterInfo =
    document.getElementById("filterInfo");


  // ============================================================
  // DISPLAY FILTER
  // ============================================================

  if (requestTypeFilter) {

    filterInfo.textContent =
      "Request Type Filter: " +
      requestTypeFilter;

  }
  else {

    filterInfo.textContent =
      "Request Type Filter: All";

  }


  // ============================================================
  // LOAD JSON DATA
  // ============================================================

  async function loadData() {

    try {

      countDiv.textContent =
        "Loading data...";

      licenseList.innerHTML =
        "";

      graphicsLayer.removeAll();


      // --------------------------------------------------------
      // Fetch data.json
      // --------------------------------------------------------

      const response =
        await fetch(DATA_URL);


      if (!response.ok) {

        throw new Error(
          `HTTP error ${response.status}`
        );

      }


      const data =
        await response.json();


      // --------------------------------------------------------
      // Read TransactionsTable
      // --------------------------------------------------------

      const rows =
        Array.isArray(data.TransactionsTable)
          ? data.TransactionsTable
          : [];


      console.log(
        "All rows:",
        rows
      );


      // ========================================================
      // FILTER
      // ========================================================

      const normalizedFilter =
        String(requestTypeFilter || "")
          .trim()
          .toLowerCase();


      const validRows =
        rows.filter(row => {

          const latitude =
            Number(row.Latitude);

          const longitude =
            Number(row.Longitude);

          const rowRequestType =
            String(row.Request_Type || "")
              .trim()
              .toLowerCase();

          const hasValidCoordinates =
            Number.isFinite(latitude) &&
            Number.isFinite(longitude);

          const hasLicense =
            String(row.License_ID || "")
              .trim() !== "";

          const matchesRequestType =
            !normalizedFilter ||
            rowRequestType === normalizedFilter;


          return (
            hasLicense &&
            hasValidCoordinates &&
            matchesRequestType
          );

        });


      // ========================================================
      // DISPLAY COUNT
      // ========================================================

      countDiv.textContent =
        `${validRows.length} licenses found`;


      // ========================================================
      // CREATE MAP POINTS
      // ========================================================

      validRows.forEach(
        (row, index) => {

          const latitude =
            Number(row.Latitude);

          const longitude =
            Number(row.Longitude);


          // ----------------------------------------------------
          // Geometry
          // ----------------------------------------------------

          const point = {

            type: "point",

            longitude:
              longitude,

            latitude:
              latitude

          };


          // ----------------------------------------------------
          // Marker symbol
          // ----------------------------------------------------

          const symbol = {

            type:
              "simple-marker",

            style:
              "circle",

            size:
              11,

            color:
              "#007ac2",

            outline: {

              color:
                "#ffffff",

              width:
                1.5

            }

          };


          // ----------------------------------------------------
          // Graphic
          // ----------------------------------------------------

          const graphic =
            new Graphic({

              geometry:
                point,

              symbol:
                symbol,


              // =================================================
              // ALL JSON FIELDS
              // =================================================

              attributes: {

                ObjectID:
                  index + 1,

                Transaction_ID:
                  row.Transaction_ID || "",

                Transaction_Date:
                  row.Transaction_Date || "",

                Contractor_ID:
                  row.Contractor_ID || "",

                Contractor_Name:
                  row.Contractor_Name || "",

                License_ID:
                  row.License_ID || "",

                Category:
                  row.Category || "",

                License_Type:
                  row.License_Type || "",

                License_Status:
                  row.License_Status || "",

                Request_Type:
                  row.Request_Type || "",

                Card_Type:
                  row.Card_Type || "",

                Card_ID:
                  row.Card_ID || "",

                Value_SAR:
                  row.Value_SAR ?? "",

                Latitude:
                  latitude,

                Longitude:
                  longitude

              },


              // =================================================
              // POPUP WITH ALL INFORMATION
              // =================================================

              popupTemplate: {

                title:
                  "License: {License_ID}",

                content: `

                  <div class="popup-content">

                    <div class="popup-section">

                      <div class="popup-section-title">
                        Transaction
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          Transaction ID:
                        </span>
                        {Transaction_ID}
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          Transaction Date:
                        </span>
                        {Transaction_Date}
                      </div>

                    </div>


                    <div class="popup-section">

                      <div class="popup-section-title">
                        Contractor
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          Contractor ID:
                        </span>
                        {Contractor_ID}
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          Contractor Name:
                        </span>
                        {Contractor_Name}
                      </div>

                    </div>


                    <div class="popup-section">

                      <div class="popup-section-title">
                        License
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          License ID:
                        </span>
                        {License_ID}
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          Category:
                        </span>
                        {Category}
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          License Type:
                        </span>
                        {License_Type}
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          License Status:
                        </span>
                        {License_Status}
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          Request Type:
                        </span>
                        {Request_Type}
                      </div>

                    </div>


                    <div class="popup-section">

                      <div class="popup-section-title">
                        Card
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          Card Type:
                        </span>
                        {Card_Type}
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          Card ID:
                        </span>
                        {Card_ID}
                      </div>

                    </div>


                    <div class="popup-section">

                      <div class="popup-section-title">
                        Financial
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          Value:
                        </span>
                        {Value_SAR} SAR
                      </div>

                    </div>


                    <div class="popup-section">

                      <div class="popup-section-title">
                        Location
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          Latitude:
                        </span>
                        {Latitude}
                      </div>

                      <div class="popup-row">
                        <span class="popup-label">
                          Longitude:
                        </span>
                        {Longitude}
                      </div>

                    </div>

                  </div>

                `

              }

            });


          // ----------------------------------------------------
          // Add graphic to map
          // ----------------------------------------------------

          graphicsLayer.add(
            graphic
          );


          // ====================================================
          // CREATE SIDEBAR ITEM
          // ====================================================

          const li =
            document.createElement(
              "li"
            );


          li.className =
            "license-item";


          li.innerHTML = `

            <div class="license-id">

              ${escapeHtml(
                row.License_ID
              )}

            </div>


            <div class="contractor">

              ${escapeHtml(
                row.Contractor_Name || ""
              )}

            </div>


            <div class="request-type">

              Request Type:

              ${escapeHtml(
                row.Request_Type || ""
              )}

            </div>


            <div class="status">

              Status:

              ${escapeHtml(
                row.License_Status || ""
              )}

            </div>


            <div class="coordinates">

              ${latitude.toFixed(6)},
              ${longitude.toFixed(6)}

            </div>

          `;


          // ====================================================
          // CLICK SIDEBAR ITEM
          // ====================================================

          li.addEventListener(
            "click",
            async function() {

              await view.goTo({

                target:
                  graphic.geometry,

                zoom:
                  17

              });


              view.openPopup({

                features:
                  [graphic],

                location:
                  graphic.geometry

              });

            }
          );


          licenseList.appendChild(
            li
          );

        }
      );


      // ========================================================
      // ZOOM TO RESULTS
      // ========================================================

      if (
        graphicsLayer.graphics.length > 0
      ) {

        await view.goTo(
          graphicsLayer.graphics.toArray(),
          {
            padding: 60
          }
        );

      }
      else {

        if (requestTypeFilter) {

          countDiv.textContent =
            `No licenses found for Request_Type = "${requestTypeFilter}"`;

        }
        else {

          countDiv.textContent =
            "No licenses found";

        }

      }

    }
    catch(error) {

      console.error(
        "ERROR:",
        error
      );


      countDiv.textContent =
        "Error loading data";


      alert(
        "Error loading data. Check the browser console."
      );

    }

  }


  // ============================================================
  // ESCAPE HTML
  // ============================================================

  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  // ============================================================
  // START
  // ============================================================

  loadData();

</script>

</body>
</html>
